services:

  cache-init:
    image: ${CACHE_IMAGE:-ghcr.io/bayinfosys/marigold-cache}:${TAG:-latest}
    command: ["python3", "-m", "tools.model_cli", "download-weights"]
    environment:
      MARIGOLD_MODEL_CATALOGUE_YAMLS: ${MARIGOLD_MODEL_CATALOGUE_YAMLS:-/app/marigold/models.yaml}
      HF_TOKEN: ${HF_TOKEN:-}
      CACHE_DIR: /models
      HF_HUB_OFFLINE: 0
    volumes:
      - ${MARIGOLD_PACKAGE_DIR}:/app/marigold:ro
      - ${MARIGOLD_CACHE_DIR}/data/models:/models
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marigold}
      POSTGRES_USER: ${POSTGRES_USER:-marigold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marigold}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marigold}"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      cache-init:
        condition: service_completed_successfully

  api:
    image: ${API_IMAGE:-ghcr.io/bayinfosys/marigold-api}:${TAG:-latest}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MARIGOLD_VERSION: ${TAG:-latest}
      MARIGOLD_DATABASE_URL: ${MARIGOLD_DATABASE_URL:-postgresql://marigold:marigold@postgres:5432/marigold}
      LIFECYCLE_TOPIC: lifecycle
      MARIGOLD_RESULTS_TABLE: results
      MARIGOLD_MODEL_CATALOGUE_YAMLS: ${MARIGOLD_MODEL_CATALOGUE_YAMLS:-/app/marigold/models.yaml}
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
    volumes:
      - ${MARIGOLD_PACKAGE_DIR}:/app/marigold:ro
    depends_on:
      postgres:
        condition: service_healthy
