services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marigold}
      POSTGRES_USER: ${POSTGRES_USER:-marigold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marigold}
    volumes:
      - ${MARIGOLD_CACHE_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marigold}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "svc.marigold.description=Backend local data store"
    networks: [core]

  cache-init:
    image: ${CACHE_IMAGE:-ghcr.io/bayinfosys/marigold-cache}:${TAG:-latest}
    command: ["python3", "-m", "tools.cache_cli", "populate"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      CACHE_DIR: /models
      HF_HUB_OFFLINE: 0
      MARIGOLD_DATABASE_URL: ${MARIGOLD_DATABASE_URL:-postgresql://marigold:marigold@postgres:5432/marigold}
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
    volumes:
      - ${MARIGOLD_APPLICATIONS_DIR}:/applications:ro
      - ${MARIGOLD_CACHE_DIR}/data/models:/models
    restart: "no"
    labels:
      - "svc.marigold.description=Local state management: cache, queues, model catalogue, etc"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]

  api:
    image: ${API_IMAGE:-ghcr.io/bayinfosys/marigold-api}:${TAG:-latest}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MARIGOLD_VERSION: ${TAG:-latest}
      MARIGOLD_DATABASE_URL: ${MARIGOLD_DATABASE_URL:-postgresql://marigold:marigold@postgres:5432/marigold}
      LIFECYCLE_TOPIC: lifecycle
      MARIGOLD_RESULTS_TABLE: results
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
      # object store: read-only for the API; it serves what the worker wrote
      MARIGOLD_STORAGE: ${MARIGOLD_STORAGE:-fs}
      MARIGOLD_STORAGE_ROOT: /data
      MARIGOLD_STORAGE_BUCKET: ${MARIGOLD_STORAGE_BUCKET:-}
      MARIGOLD_STORAGE_ENDPOINT: ${MARIGOLD_STORAGE_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${MARIGOLD_CACHE_DIR}/data/outputs:/data/outputs:ro
    labels:
      - "svc.marigold.description=Access to the marigold core services from outside the network"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core, applications]

networks:
  core:
    name: marigold-core
  applications:
    name: marigold-applications
