# The application layer: one package's code, running against the API.
#
# Started by `marigold application start` as compose project
# marigold-<application>, separate from the platform, so starting,
# stopping or resizing one application touches nothing else.
#
# Every variable here is set by the CLI (cli/compose.py, compose_env).
# The package root is mounted read-only at /app, so a flat package runs
# main.py and a larger one adds modules and data beside it.

services:
  executor:
    image: ${MARIGOLD_EXECUTION_IMAGE:-ghcr.io/bayinfosys/marigold-executor-python:latest}
    pull_policy: missing
    command: ${MARIGOLD_EXECUTION_COMMAND:-python main.py}
    working_dir: /app
    environment:
      MARIGOLD_API_BASE: ${MARIGOLD_API_BASE:-http://api:8000}
      MARIGOLD_APPLICATION_NAME: ${MARIGOLD_APPLICATION_NAME}
      MARIGOLD_APPLICATION_ID: ${MARIGOLD_APPLICATION_ID}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${MARIGOLD_PACKAGE_DIR}:/app:ro
      - ${MARIGOLD_APPLICATIONS_DIR}/${MARIGOLD_APPLICATION_NAME}/outputs:/outputs
    restart: "no"
    labels:
      svc.marigold.description: "Application code for one package, running against the API"
    networks:
      - applications

networks:
  applications:
    name: marigold-applications
    external: true
