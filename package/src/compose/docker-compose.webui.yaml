services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${MARIGOLD_BIND:-127.0.0.1}:${MARIGOLD_WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_KEY=${WEBUI_DUMMY_KEY:-marigold}
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - WEBUI_AUTH=false
      - AIOHTTP_CLIENT_TIMEOUT=300
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://api:8000/v1
      - RAG_OPENAI_API_KEY=${WEBUI_DUMMY_KEY:-marigold}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/all-minilm-l6-v2}
      - RAG_RERANKING_MODEL=${RAG_RERANKING_MODEL:-}
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - ANONYMIZED_TELEMETRY=False
      - DO_NOT_TRACK=True
      - SCARF_NO_ANALYTICS=True
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
    volumes:
      - type: bind
        source: ${MARIGOLD_CACHE_DIR:-~/.marigold/cache}/data/webui
        target: /app/backend/data
        bind:
          create_host_path: false
    labels:
      - "svc.marigold.description=OpenWebUI interface for chat access to LLMs in the marigold cache"
    mem_limit: ${MARIGOLD_WEBUI_MEMORY:-2g}
    cpus: ${MARIGOLD_WEBUI_CPUS:-0}
    pids_limit: ${MARIGOLD_WEBUI_PIDS:--1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - applications

# Open WebUI joins the platform project, which creates this network from
# docker-compose.core.yaml; declared the same way here.
networks:
  applications:
    name: marigold-applications
