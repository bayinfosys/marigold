services:

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/bayinfosys/marigold-worker}:${TAG:-latest}
    environment:
      MARIGOLD_VERSION: ${TAG:-latest}
      # single-level default only -- if POSTGRES_PASSWORD is overridden
      # without also overriding MARIGOLD_DATABASE_URL, the two diverge.
      # The CLI is expected to set MARIGOLD_DATABASE_URL explicitly
      # (from marigold.toml or the shell) rather than rely on this
      # fallback; this exists for someone running docker compose
      # directly, without the CLI.
      MARIGOLD_DATABASE_URL: ${MARIGOLD_DATABASE_URL:-postgresql://marigold:marigold@postgres:5432/marigold}
      SQS_VISIBILITY_TIMEOUT: "300"
      MARIGOLD_QUEUE_IDLE_TIMEOUT: "${IDLE_TIMEOUT:-120}"
      LIFECYCLE_TOPIC: lifecycle
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_DIR: /models
      REMOTE_CODE: "0"
      USE_FAST: "0"
      MARIGOLD_TMP_OFFLOAD: "/tmp/models"
      OUTPUT_BACKEND: "${OUTPUT_BACKEND:-fs}"
      OUTPUT_DIR: /outputs
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
    volumes:
      - ${MARIGOLD_CACHE_DIR}/data/models:/models:ro
      - ${MARIGOLD_CACHE_DIR}/data/tmp:/tmp/models
      - ${MARIGOLD_CACHE_DIR}/data/outputs:/outputs
    restart: on-failure:3
    labels:
      - "svc.marigold.description=Worker container pulls work from the queues and runs against models on host hardware"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
