# The inference worker. The marigold CLI sets every variable from
# marigold-host.toml (cli/host_config.py); run without the CLI, each
# takes the environment's value or the default shown.

services:

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/bayinfosys/marigold-worker}:${TAG:-latest}
    # Runs as the host user, so the outputs it writes belong to whoever
    # runs marigold. Blank runs as the image's own user.
    user: ${MARIGOLD_USER:-}
    environment:
      HOME: /tmp
      MARIGOLD_VERSION: ${TAG:-latest}
      MARIGOLD_DATABASE_URL: ${MARIGOLD_DATABASE_URL:-postgresql://marigold:marigold@postgres:5432/marigold}
      MARIGOLD_VISIBILITY_TIMEOUT: "300"
      MARIGOLD_QUEUE_IDLE_TIMEOUT: "${MARIGOLD_IDLE_TIMEOUT:-120}"
      LIFECYCLE_TOPIC: lifecycle
      LOG_LEVEL: ${MARIGOLD_LOG_LEVEL:-INFO}
      CACHE_DIR: /models
      REMOTE_CODE: "0"
      USE_FAST: "0"
      MARIGOLD_TMP_OFFLOAD: "/tmp/models"
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
      # object store: [storage] in marigold-host.toml
      MARIGOLD_STORAGE: ${MARIGOLD_STORAGE:-fs}
      MARIGOLD_STORAGE_ROOT: /data
      MARIGOLD_STORAGE_BUCKET: ${MARIGOLD_STORAGE_BUCKET:-}
      MARIGOLD_STORAGE_ENDPOINT: ${MARIGOLD_STORAGE_ENDPOINT:-}
      MARIGOLD_STORAGE_CONTAINER: ${MARIGOLD_STORAGE_CONTAINER:-}
      # secrets: from the shell environment, never from marigold-host.toml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    volumes:
      - type: bind
        source: ${MARIGOLD_CACHE_DIR:-~/.marigold/cache}/data/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARIGOLD_CACHE_DIR:-~/.marigold/cache}/data/tmp
        target: /tmp/models
        bind:
          create_host_path: false
      - type: bind
        source: ${MARIGOLD_CACHE_DIR:-~/.marigold/cache}/data/outputs
        target: /data/outputs
        bind:
          create_host_path: false
    restart: on-failure:3
    mem_limit: ${MARIGOLD_WORKER_MEMORY:-0}
    cpus: ${MARIGOLD_WORKER_CPUS:-0}
    pids_limit: ${MARIGOLD_WORKER_PIDS:--1}
    shm_size: ${MARIGOLD_WORKER_SHM:-2g}
    labels:
      - "svc.marigold.description=Worker container pulls work from the queues and runs against models on host hardware"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
