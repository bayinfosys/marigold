# Marigold model definitions.
# This is the single source of truth for all models in the system.
#
# Fields
# ------
# name             Model identifier, passed verbatim to the provider.
#                  For huggingface: org/model (e.g. facebook/mms-tts-eng).
# provider         Model hosting provider. Valid: huggingface.
# type             Model category. Drives MODEL_TYPE env var and cache target.
#                  Valid: text-embedding, image-embedding, instruct, tts, depth,
#                         img2txt, txt2img, img2mask, txt2audio, img2mesh
# input            Input modality (text, image, chat, audio)
# output           Output modality (vector/N, chat, speech, depth, mask, image)
# memory_size      ECS task memory in MB. Default: 9216
# timeout          SQS visibility timeout in seconds. Default: 300
# idle_timeout     Seconds the worker keeps polling after the queue empties.
#                  Default: 0. Use 600 for GPU tasks, 3600 for cheap CPU tasks.
# auth_required    Whether provider credentials are needed to download this
#                  model. For huggingface: requires TF_VAR_hf_token.
#                  Default: false.
# langcode         BCP-47 language code for TTS models (e.g. en/GB, cy/GB).
#                  Injected as MODEL_LANGCODE.
# log_level        Override the default INFO log level. Injected as LOG_LEVEL.
# extra_env        Arbitrary extra environment variables passed verbatim to
#                  the task. Values must be strings.
# parameters       Model-specific metadata written to models.json. Not used
#                  by Terraform infrastructure.
#   vector_size    Embedding output dimension (text-embedding, image-embedding).
#
# Workflow
# --------
# After editing this file:
#   make validate-models
#   make generate-models       (writes models.tfvars)
#   make generate-catalogue    (writes models.json; needs network + HF_TOKEN)
#   git add assets/models.yaml assets/models.json assets/models.tfvars
#   LAYER=02 make plan && LAYER=02 make apply
#   LAYER=03 make plan && LAYER=03 make apply
#   make deploy/cache-builder

models:

  # ---------------------------------------------------------------------------
  # Text embedding
  # ---------------------------------------------------------------------------

  - name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
    provider: huggingface
    type: text-embedding
    input: text
    output: vector/768
    idle_timeout: 3600
    parameters:
      vector_size: 768

  - name: sentence-transformers/sentence-t5-large
