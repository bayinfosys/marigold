# ---------------------------------------------------------------------------
# Marigold model definitions.
# Single source of truth for all models in the system.
#
# Fields
# ------
# name             Model identifier passed verbatim to the provider.
# provider         Model hosting provider. Valid: huggingface, tools.
# type             Model category. Drives MODEL_TYPE env var and cache target.
#                  Valid: text-embedding, image-embedding, instruct, tts, depth,
#                         img2txt, txt2img, img2mask, txt2audio, image-eval,
#                         image-text-eval, text-eval, http
# input            Input modality (text, image, chat, audio, json, image+text)
# output           Output modality (vector/N, chat, speech, depth, mask,
#                                   image, audio, json, scores)
# timeout          SQS visibility timeout in seconds. Default: 300.
# idle_timeout     Seconds the worker keeps polling after queue empties.
#                  Default: 0. Use 600 for GPU, 3600 for cheap CPU tasks.
# auth_required    Whether provider credentials are needed. Default: false.
# langcode         BCP-47 language code for TTS models.
# log_level        Override default INFO log level.
# extra_env        Arbitrary extra environment variables (string values only).
# description      Human-readable description for the public catalogue and
#                  semantic model search. Cover: purpose, strengths, use cases,
#                  constraints.
# parameters       Model-specific metadata for the API layer only.
#   vector_size    Embedding output dimension.
#
# Workflow
# --------
# After editing:
#   make validate-models
#   make generate-models       (writes assets/models.tfvars)
#   make generate-catalogue    (writes assets/models.json; needs network + HF_TOKEN)
#   git add assets/models.yaml assets/models.json assets/models.tfvars
#   LAYER=02 make plan && LAYER=02 make apply
#   LAYER=03 make plan && LAYER=03 make apply
#   make deploy/cache-builder
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Templates
#
# YAML anchors (&name) define reusable field sets.
# Merge key (<<:) folds the anchor into a model entry.
# Fields defined directly on the model override the template.
# The _templates key is stripped by the loader before Pydantic validation.
# ---------------------------------------------------------------------------

_templates:

  # ---------------------------------------------------------------------------
  # Instruct
  # ---------------------------------------------------------------------------

  huggingface_instruct_cpu: &hf_instruct_cpu
    provider: huggingface
    type: instruct
    input: chat
    output: chat
    timeout: 600
    gpu_tier: "none"
    gpu_units: 0
    memory_size: 6144

  huggingface_instruct_sm: &hf_instruct_sm
    provider: huggingface
    type: instruct
    input: chat
    output: chat
    timeout: 600
    gpu_tier: sm
    gpu_units: 1
    memory_size: 8192
    extra_env:
      LOAD_IN_4BIT: "1"

  huggingface_instruct_lrg: &hf_instruct_lrg
    provider: huggingface
    type: instruct
    input: chat
    output: chat
    timeout: 600
    gpu_tier: lrg
    gpu_units: 1
    memory_size: 16384
    extra_env:
      LOAD_IN_4BIT: "1"
  # ---------------------------------------------------------------------------
  # Text embedding
  # ---------------------------------------------------------------------------

  huggingface_embedding: &hf_embedding
    provider: huggingface
    type: text-embedding
    input: text
    gpu_tier: "none"
    gpu_units: 0
    memory_size: 4096

  huggingface_embedding_sm: &hf_embedding_sm
    provider: huggingface
    type: text-embedding
    input: text
    gpu_tier: sm
    gpu_units: 1
    memory_size: 4096

  # ---------------------------------------------------------------------------
  # Image embedding
  # ---------------------------------------------------------------------------

  huggingface_image_embedding: &hf_image_embedding
    provider: huggingface
    type: image-embedding
    input: image
    gpu_tier: "none"
    gpu_units: 0

  # ---------------------------------------------------------------------------
  # TTS
  # ---------------------------------------------------------------------------

  huggingface_tts: &hf_tts
    provider: huggingface
    type: tts
    input: text
    output: speech
    gpu_tier: "none"
    gpu_units: 0

  huggingface_tts_sm: &hf_tts_sm
    provider: huggingface
    type: tts
    input: text
    output: speech
    gpu_tier: sm
    gpu_units: 1

  # ---------------------------------------------------------------------------
  # Image generation (always GPU, always lrg)
  # ---------------------------------------------------------------------------

  huggingface_txt2img_lrg: &hf_txt2img_lrg
    provider: huggingface
    type: txt2img
    input: text
    output: image
    timeout: 600
    gpu_tier: lrg
    gpu_units: 1
    memory_size: 16384

  # ---------------------------------------------------------------------------
  # Audio generation
  # ---------------------------------------------------------------------------

  huggingface_txt2audio: &hf_txt2audio
    provider: huggingface
    type: txt2audio
    input: text
    output: audio
    timeout: 600
    gpu_tier: "none"
    gpu_units: 0
    memory_size: 10240

  # ---------------------------------------------------------------------------
  # Eval
  # ---------------------------------------------------------------------------

  huggingface_text_eval: &hf_text_eval
    provider: huggingface
    type: text-eval
    input: text
    output: json
    gpu_tier: "none"
    gpu_units: 0

  huggingface_image_eval: &hf_image_eval
    provider: huggingface
    type: image-eval
    input: image
    output: json
    gpu_tier: "none"
    gpu_units: 0

  huggingface_asr: &hf_asr
    provider: huggingface
    type: asr
    input: audio
    output: text
    timeout: 300
    gpu_tier: "none"
    gpu_units: 0
    memory_size: 4096

  huggingface_asr_sm: &hf_asr_sm
    provider: huggingface
    type: asr
    input: audio
    output: text
    timeout: 300
    gpu_tier: sm
    gpu_units: 1
    memory_size: 8192

  huggingface_txt2vid_lrg: &hf_txt2vid_lrg
    provider: huggingface
    type: txt2vid
    input: text
    output: video
    timeout: 1800
    gpu_tier: lrg
    gpu_units: 1
    memory_size: 24576

  huggingface_img2vid_lrg: &hf_img2vid_lrg
    provider: huggingface
    type: img2vid
    input: image
    output: video
    timeout: 1800
    gpu_tier: lrg
    gpu_units: 1
    memory_size: 24576

#  huggingface_vid2vid_lrg: &hf_vid2vid_lrg
#    provider: huggingface
#    type: vid2vid
#    input: video
#    output: video
#    timeout: 1800
#    gpu_tier: lrg
#    gpu_units: 1
#    memory_size: 24576

  huggingface_vid2txt_sm: &hf_vid2txt_sm
    provider: huggingface
    type: vid2txt
    input: video
    output: text
    timeout: 600
    gpu_tier: sm
    gpu_units: 1
    memory_size: 16384

  huggingface_obs2act_lrg: &hf_obs2act_lrg
    provider: huggingface
    type: obs2act
    input: image
    output: text
    timeout: 120
    gpu_tier: lrg
    gpu_units: 1
    memory_size: 16384

models:

  # ---------------------------------------------------------------------------
  # Text embedding
  # ---------------------------------------------------------------------------

#  - <<: *hf_embedding
#    name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
#    output: vector/768
#    description: >
#      Multilingual sentence embedding model supporting 50+ languages.
#      Strong performance on paraphrase detection, semantic similarity, and
#      cross-lingual retrieval. Good general-purpose embedding for multilingual
#      document search pipelines.
#    parameters:
#      vector_size: 768

  - <<: *hf_embedding
    name: sentence-transformers/sentence-t5-large
    output: vector/768
    description: >
      English sentence embedding model based on T5-Large. Strong on semantic
      textual similarity and sentence retrieval tasks. Higher quality than
      smaller MiniLM variants at the cost of inference time.
    parameters:
      vector_size: 768

  - <<: *hf_embedding
    name: sentence-transformers/all-minilm-l6-v2
    output: vector/384
    description: >
      Compact and fast English sentence embedding model. Good for
      high-throughput semantic search and clustering where latency matters
      more than top-tier accuracy. 384-dimensional output.
    parameters:
      vector_size: 384

  - <<: *hf_embedding
    name: baai/bge-m3
    output: vector/1024
    memory_size: 6144
    description: >
      Dense and sparse text embedding model supporting 100+ languages.
      Strong on multilingual retrieval, semantic search, and cross-lingual
      similarity. Good choice for RAG systems with mixed-language content.
      1024-dimensional output.
    parameters:
      vector_size: 1024

  - <<: *hf_embedding
    name: baai/bge-small-en-v1.5
    output: vector/512
    description: >
      Small and efficient English embedding model from BAAI. Good balance
      of speed and quality for English-only semantic search and retrieval.
      512-dimensional output.
    parameters:
      vector_size: 512

#  - <<: *hf_embedding
#    name: microsoft/harrier-oss-v1-270m
#    output: vector/640
#    description: >
#      270M parameter text embedding model from Microsoft. Supports web
#      search query, semantic similarity, and bitext retrieval prompts.
#      640-dimensional output.
#    parameters:
#      vector_size: 640

  - <<: *hf_embedding
    name: microsoft/harrier-oss-v1-0.6b
    output: vector/1024
    description: >
      600M parameter text and image embedding model from Microsoft.
      Supports web search, semantic similarity, and bitext retrieval.
      Multimodal capable. 1024-dimensional output. Higher quality than
      the 270M variant.
    parameters:
      vector_size: 1024

#  - <<: *hf_embedding
#    name: jinaai/jina-embeddings-v3
#    output: vector/1024
#    description: >
#      570M parameter multilingual text embedding model from Jina AI.
#      Supports 8192 token context, 100 languages, and task-specific
#      LoRA adapters for retrieval, classification, and clustering.
#      Strong long-document retrieval performance. Apache 2.0 licence.
#    parameters:
#      vector_size: 1024

  - <<: *hf_embedding
    name: nomic-ai/nomic-embed-text-v1.5
    output: vector/768
    description: >
      English text embedding model from Nomic AI. 8192 token context.
      Strong on long document retrieval and semantic search. Matryoshka
      representation allows truncating to smaller dimensions without
      retraining. Apache 2.0 licence.
    parameters:
      vector_size: 768

  - <<: *hf_embedding
    name: intfloat/multilingual-e5-large-instruct
    output: vector/1024
    description: >
      560M multilingual instruction-following embedding model. Covers
      94 languages. Takes an instruction prefix describing the embedding
      task, improving retrieval quality for domain-specific use cases.
      MIT licence.
    parameters:
      vector_size: 1024

  - <<: *hf_embedding
    name: thenlper/gte-large
    output: vector/1024
    description: >
      335M English embedding model with strong MTEB benchmark scores.
      Fast and compact. Good for high-throughput semantic search where
      bge-m3 is too heavy. MIT licence.
    parameters:
      vector_size: 1024

  # ---------------------------------------------------------------------------
  # Image embedding
  # ---------------------------------------------------------------------------

  - <<: *hf_image_embedding
    name: google/siglip-base-patch16-224
    output: vector/768
    description: >
      Vision-language embedding model from Google. Good for image-text
      similarity, cross-modal retrieval, and visual content classification.
      Base variant; faster and lighter than the so400m variant.
      768-dimensional output.
    parameters:
      vector_size: 768

  - <<: *hf_image_embedding
    name: google/siglip2-so400m-patch14-224
    output: vector/1152
    description: >
      Large vision-language embedding model from Google. Higher quality
      than the base variant for image-text alignment and cross-modal
      retrieval tasks. 1152-dimensional output. Suited for quality-gated
      image generation pipelines.
    parameters:
      vector_size: 1152

  # ---------------------------------------------------------------------------
  # Instruct / chat -- CPU tier
  #   there are none because the performance was so terrible
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Instruct / chat -- GPU sm tier (T4, 16GB VRAM)
  # All models run with LOAD_IN_4BIT=1 from the template default.
  # ---------------------------------------------------------------------------

  - <<: *hf_instruct_sm
    name: qwen/qwen2-0.5b-instruct
    memory_size: 3072
    description: >
      Compact 0.5B instruction-following model from Alibaba. Good for simple
      chat, classification, and lightweight text tasks where low latency
      on CPU matters most.

  - <<: *hf_instruct_sm
    name: qwen/qwen2-1.5b-instruct
    memory_size: 5120
    description: >
      1.5B instruction model from Alibaba. Balances speed and capability
      for general chat and simple reasoning tasks on CPU.

  - <<: *hf_instruct_sm
    name: qwen/qwen2.5-7b-instruct
    memory_size: 20480
    description: >
      7B instruction model from Alibaba. Strong general-purpose reasoning,
      instruction following, and multilingual capability. Good CPU-tier
      workhorse for chat and structured output tasks.

  - <<: *hf_instruct_sm
    name: qwen/qwen2.5-coder-7b-instruct
    memory_size: 20480
    description: >
      7B model specialised for code generation and understanding. Strong
      on code completion, explanation, debugging, and multi-language
      programming tasks. Good fit for coding assistant integrations.

  - <<: *hf_instruct_sm
    name: qwen/qwen3-4b
    description: >
      Qwen3 4B dense instruction model. Improved reasoning and instruction
      following over Qwen2 at the same parameter count. Good for general
      chat and structured output on CPU.

  - <<: *hf_instruct_sm
    name: qwen/qwen3.5-0.8b
    memory_size: 3072
    description: >
      Very compact 0.8B instruction model. Suited for latency-sensitive
      tasks, edge-like deployments, and high-throughput lightweight
      classification or routing.

  - <<: *hf_instruct_sm
    name: madeagents/hammer2.1-3b
    memory_size: 8192
    description: >
      3B instruction model tuned for agentic tool use and function calling.
      Good for structured action generation, tool-use pipelines, and
      lightweight agent tasks.

  - <<: *hf_instruct_sm
    name: mistralai/mistral-7b-instruct-v0.3
    memory_size: 20480
    description: >
      7B instruction model from Mistral AI. Strong English reasoning
      and instruction following. Widely tested and well understood
      for general-purpose chat and structured output.

  - <<: *hf_instruct_sm
    name: meta-llama/llama-3.2-1b-instruct
    memory_size: 4096
    auth_required: true
    description: >
      Llama 3.2 1B instruction model from Meta. Lightweight and fast on
      CPU. Good for simple chat, classification, and latency-sensitive
      tasks where the Llama family is preferred. Requires HuggingFace
      access approval.

  - <<: *hf_instruct_sm
    name: google/gemma-3-4b-it
    auth_required: true
    description: >
      Gemma 3 4B instruction model from Google. Good general-purpose
      chat and reasoning at a small parameter count. Multimodal-capable
      architecture. Requires HuggingFace access approval.

  - <<: *hf_instruct_sm
    name: tiiuae/falcon3-7b-instruct
    memory_size: 20480
    description: >
      7B instruction model from the Technology Innovation Institute.
      Trained on 14 trillion tokens. Strong general-purpose reasoning
      and instruction following for CPU-tier chat and structured output
      tasks. Apache 2.0 licence.

  - <<: *hf_instruct_sm
    name: qwen/qwen3.5-9b
    memory_size: 10240
    description: >
      Qwen3.5 9B dense instruction model. Strong reasoning and instruction
      following. Runs on gpu-sm with 4-bit quantisation.

  - <<: *hf_instruct_sm
    name: qwen/qwen3-8b
    description: >
      Qwen3 8B dense instruction model. Strong general-purpose reasoning
      and chat. Efficient on gpu-sm with 4-bit quantisation and good
      throughput on T4.

  - <<: *hf_instruct_sm
    name: meta-llama/llama-3.1-8b-instruct
    auth_required: true
    description: >
      Llama 3.1 8B instruction model from Meta. Strong reasoning,
      instruction following, and tool use capability. Good GPU-tier
      general-purpose model. Requires HuggingFace access approval.

  - <<: *hf_instruct_sm
    name: ibm-granite/granite-3.3-8b-instruct
    description: >
      8B instruction model from IBM. Apache 2.0 licence. Designed for
      enterprise use including RAG, tool use, and structured output.
      Strong instruction following with focus on reliability and
      auditability. Good fit for regulated sector workflows.

  - <<: *hf_instruct_sm
    name: deepseek-ai/deepseek-r1-distill-llama-8b
    memory_size: 12288
    description: >
      8B reasoning model distilled from DeepSeek-R1 into the Llama-3
      base. Applies extended chain-of-thought before responding. Strong
      on complex reasoning, coding, and mathematical tasks. Extended KV
      cache growth during reasoning requires additional memory headroom.
      MIT licence.

  - <<: *hf_instruct_sm
    name: deepseek-ai/deepseek-r1-distill-qwen-7b
    memory_size: 12288
    description: >
      7B reasoning model distilled from DeepSeek-R1 into the Qwen2.5
      base. Applies chain-of-thought reasoning before responding. Strong
      on multi-step problem solving and mathematical reasoning. MIT licence.

  - <<: *hf_instruct_sm
    name: zai-org/glm-4-9b-0414
    memory_size: 10240
    description: >
      9B instruction model from Zhipu AI. Strong multilingual capability
      with good Chinese and English performance. Suited for bilingual
      chat and document tasks.

  - <<: *hf_instruct_sm
    name: qwen/qwen3-4b-thinking-2507
    memory_size: 10240
    description: >
      Qwen3 4B model with extended reasoning (thinking) capability.
      Applies chain-of-thought before responding. KV cache growth during
      thinking warrants gpu-sm placement over CPU.

  - <<: *hf_instruct_sm
    name: google/gemma-3-12b-it
    memory_size: 12288
    auth_required: true
    description: >
      Gemma 3 12B instruction model from Google. Strong reasoning,
      coding, and instruction following. 128K context window and
      multilingual support. Requires HuggingFace access approval.

  - <<: *hf_instruct_sm
    name: microsoft/phi-4
    memory_size: 12288
    description: >
      14B instruction model from Microsoft. MIT licence. Strong on
      reasoning, STEM tasks, and instruction following at 14B scale.
      Fits on gpu-sm with 4-bit quantisation (~7GB weights, ~10GB
      total with KV cache).

  - <<: *hf_instruct_sm
    name: qwen/qwen3-14b
    memory_size: 12288
    description: >
      Qwen3 14B dense instruction model from Alibaba. Strong reasoning,
      multilingual capability, and instruction following. Fits on gpu-sm
      with 4-bit quantisation (~7GB weights, ~10GB total with KV cache).

  # ---------------------------------------------------------------------------
  # Instruct / chat -- GPU lrg tier (A10G, 24GB VRAM)
  # All models run with LOAD_IN_4BIT=1 from the template default.
  # ---------------------------------------------------------------------------

#  - <<: *hf_instruct_lrg
#    name: mistralai/mistral-small-24b-instruct-2501
#    memory_size: 20480
#    description: >
#      Mistral Small 3 at 24B parameters. Apache 2.0 licence. Strong
#      function calling, instruction following, and knowledge density.
#      ~12GB weights at 4-bit on a single A10G.

#  - <<: *hf_instruct_lrg
#    name: qwen/qwen3-30b-a3b
#    memory_size: 22528
#    description: >
#      Qwen3 30B mixture-of-experts model with 3B active parameters per
#      token. High total capacity at low inference cost per token.
#      ~15GB weights at 4-bit on a single A10G. Apache 2.0 licence.

  - <<: *hf_instruct_lrg
    name: google/gemma-3-27b-it
    memory_size: 22528
    auth_required: true
    description: >
      Gemma 3 27B instruction model from Google. Near-frontier quality
      at 4-bit quantisation (~14GB weights). 128K context window,
      multimodal architecture, 140+ languages. Requires HuggingFace
      access approval.

#  - <<: *hf_instruct_lrg
#    name: qwen/qwen3-32b
#    memory_size: 28672
#    description: >
#      qwen 3 32b

  # ---------------------------------------------------------------------------
  # Image segmentation
  # ---------------------------------------------------------------------------

  - name: facebook/sam-vit-huge
    provider: huggingface
    type: img2mask
    input: image
    output: mask
    gpu_tier: lrg
    gpu_units: 1
    timeout: 600
    description: >
      Segment Anything Model (SAM) ViT-Huge from Meta. Produces high-quality
      segmentation masks from image prompts (points, boxes, or automatic).
      Requires GPU for practical inference speed.

  # ---------------------------------------------------------------------------
  # Depth estimation
  # ---------------------------------------------------------------------------

  - name: facebook/dpt-dinov2-small-kitti
    provider: huggingface
    type: depth
    input: image
    output: depth
    gpu_tier: "none"
    gpu_units: 0
    description: >
      Monocular depth estimation model from Meta. Estimates per-pixel
      depth from a single RGB image. Trained on KITTI driving data.
      Good for scene geometry estimation and 3D-aware applications.

  # ---------------------------------------------------------------------------
  # Image generation (GPU lrg)
  # ---------------------------------------------------------------------------

  - <<: *hf_txt2img_lrg
    name: stabilityai/stable-diffusion-3.5-large-turbo
    description: >
      Stable Diffusion 3.5 Large Turbo from Stability AI. High-quality
      text-to-image generation with strong prompt adherence.

  - <<: *hf_txt2img_lrg
    name: black-forest-labs/flux.1-schnell
    description: >
      FLUX.1 Schnell from Black Forest Labs. Fast high-quality
      text-to-image generation. Schnell variant optimised for speed
      with minimal quality trade-off.

  - <<: *hf_txt2img_lrg
    name: tongyi-mai/z-image-turbo
    description: >
      Z-Image Turbo excels in photorealistic image generation,
      bilingual text rendering (English & Chinese), and robust
      instruction adherence.

  # ---------------------------------------------------------------------------
  # Image and text evaluation
  # ---------------------------------------------------------------------------

  - name: openai/clip-vit-large-patch14
    provider: huggingface
    type: image-text-eval
    input: image+text
    output: scores
    gpu_tier: "none"
    gpu_units: 0
    description: >
      CLIP ViT-L/14 from OpenAI. Computes similarity scores between
      images and text descriptions. Used in quality-gated image generation
      pipelines to score output against the original prompt.

  - name: clip-vit-b-32
    provider: huggingface
    type: image-text-eval
    input: image+text
    output: json
    gpu_tier: "none"
    gpu_units: 0
    description: >
      CLIP ViT-B/32 image-text alignment model. Lightweight variant for
      computing image-text similarity scores. Used for prompt alignment
      evaluation in generation quality pipelines.

  # ---------------------------------------------------------------------------
  # Tools
  # ---------------------------------------------------------------------------

  - name: http
    provider: tools
    type: http
    input: json
    output: json
    gpu_tier: "none"
    gpu_units: 0
    timeout: 30
    description: >
      HTTP tool worker. Executes outbound HTTP requests as workflow steps.
      Used for webhook delivery, external API calls, and URL fetching
      within multi-step pipelines.

  # ---------------------------------------------------------------------------
  # Text to speech
  # ---------------------------------------------------------------------------

  - <<: *hf_tts
    name: facebook/mms-tts-eng
    langcode: en/GB
    description: >
      English text-to-speech model from Meta MMS. Fast and lightweight
      for speech synthesis in English.

  - <<: *hf_tts
    name: facebook/mms-tts-cym
    langcode: cy/GB
    description: >
      Welsh text-to-speech model from Meta MMS. One of very few
      open-weight TTS models with Welsh language support.

  - <<: *hf_tts
    name: facebook/mms-tts-deu
    langcode: de/DE
    description: >
      German text-to-speech model from Meta MMS.

  - <<: *hf_tts
    name: facebook/mms-tts-fra
    langcode: fr/FR
    description: >
      French text-to-speech model from Meta MMS.

  - <<: *hf_tts
    name: facebook/mms-tts-spa
    langcode: es/ES
    description: >
      Spanish text-to-speech model from Meta MMS.

  - <<: *hf_tts
    name: facebook/mms-tts-fin
    langcode: fi/FI
    description: >
      Finnish text-to-speech model from Meta MMS.

  - <<: *hf_tts
    name: facebook/mms-tts-nld
    langcode: nl/NL
    description: >
      Dutch text-to-speech model from Meta MMS.

#  - <<: *hf_tts
#    name: parler-tts/parler-tts-mini-v1
#    description: >
#      Controllable text-to-speech model. Voice characteristics including
#      pitch, speed, and accent are specified in natural language alongside
#      the text to synthesise. Good for diverse voice generation without
#      per-voice fine-tuning. Apache 2.0 licence.

#  - <<: *hf_tts
#    name: outeai/outetts-0.2-500m
#    description: >
#      500M parameter TTS model from OuteAI built on the Qwen-2.5
#      architecture. Natural-sounding English synthesis with good
#      prosody. Compact and fast for CPU-tier inference. Apache 2.0
#      licence.

  # ---------------------------------------------------------------------------
  # Audio generation
  # ---------------------------------------------------------------------------

  - <<: *hf_txt2audio
    name: facebook/musicgen-small
    description: >
      Small music generation model from Meta. Generates short audio clips
      from text descriptions. Good for background music generation and
      audio prototyping.

  - <<: *hf_txt2audio
    name: cvssp/audioldm2
    description: >
      Latent diffusion model for general audio and sound effect generation.
      Produces diverse audio from text prompts. Good for sound design
      and non-music audio generation.
    extra_env:
      NUM_INFERENCE_STEPS: "50"

  # ---------------------------------------------------------------------------
  # Text evaluation
  # ---------------------------------------------------------------------------

  - <<: *hf_text_eval
    name: openai/privacy-filter
    description: >
      PII detection and privacy filtering model. Identifies personal
      information in text including names, addresses, and identifiers.
      Used in data sanitisation pipelines before downstream processing.
    extra_env:
      TRUST_REMOTE_CODE: "true"

  - <<: *hf_text_eval
    name: dslim/bert-base-ner
    description: >
      BERT-base named entity recognition model. Extracts persons,
      organisations, locations, and miscellaneous entities from text.
      Good for document parsing and entity extraction pipelines.

  - <<: *hf_text_eval
    name: dslim/bert-large-ner
    description: >
      BERT-large named entity recognition model. Higher accuracy than
      the base variant for entity extraction. Better suited for
      precision-sensitive document parsing tasks.

  # ---------------------------------------------------------------------------
  # Image evaluation
  # ---------------------------------------------------------------------------

  - <<: *hf_image_eval
    name: falconsai/nsfw_image_detection
    description: >
      NSFW image classification model. Detects inappropriate or explicit
      content in images. Used in content moderation pipelines and
      safety-gated image generation outputs.

  - <<: *hf_image_eval
    name: cafeai/cafe_aesthetic
    description: >
      Aesthetic quality scoring model for images. Rates visual appeal
      on a continuous scale. Used in quality-gated image generation
      pipelines to filter low-aesthetic outputs.


# ---------------------------------------------------------------------------
  # ASR
  # ---------------------------------------------------------------------------

  - <<: *hf_asr
    name: openai/whisper-tiny
    description: >
      Whisper Tiny from OpenAI. 39M parameter multilingual speech recognition
      model. Fastest and smallest Whisper variant. Good for high-throughput
      transcription where accuracy is secondary, and for local development
      and testing without GPU.

  - <<: *hf_asr
    name: openai/whisper-small
    description: >
      Whisper Small from OpenAI. 244M parameter multilingual speech recognition
      model. Good balance of speed and accuracy for CPU-tier inference across
      a broad range of languages.

  - <<: *hf_asr_sm
    name: openai/whisper-large-v3
    description: >
      Whisper Large v3 from OpenAI. 1.5B parameter multilingual model.
      State-of-the-art accuracy across 99 languages. Best choice for
      production transcription where accuracy matters.

  - <<: *hf_asr_sm
    name: distil-whisper/distil-large-v3
    description: >
      Distilled version of Whisper Large v3. 756M parameters. Approximately
      twice the throughput of the full model with minimal accuracy loss on
      English. Good production choice for English-primary workloads.

  # ---------------------------------------------------------------------------
  # Text to video
  # ---------------------------------------------------------------------------

  - <<: *hf_txt2vid_lrg
    name: thudm/cogvideox-2b
    description: >
      CogVideoX 2B from Tsinghua/Zhipu AI. Text-to-video generation at
      480x720 resolution, 49 frames at 8fps. Fits comfortably on a single
      A10G 24GB. Good quality for the parameter count. Practical starting
      point for video generation without multi-GPU requirements.
    extra_env:
      NUM_STEPS: "50"

  - <<: *hf_txt2vid_lrg
    name: wan-ai/wan2.1-t2v-1.3b
    description: >
      Wan 2.1 T2V 1.3B from Alibaba. Smallest practical text-to-video
      model in the Wan family. Lower VRAM requirement than CogVideoX-2b.
      Good for testing the txt2vid handler locally or on smaller GPU instances.
    extra_env:
      NUM_STEPS: "50"

  # ---------------------------------------------------------------------------
  # Image to video
  # ---------------------------------------------------------------------------

  - <<: *hf_img2vid_lrg
    name: stabilityai/stable-video-diffusion-img2vid-xt
    description: >
      Stable Video Diffusion Image-to-Video XT from Stability AI. Generates
      25 frames at 576x1024 from a single conditioning image. Strong motion
      quality for product shots, character animation, and scene transitions.
      KEYFRAME_MODE=single.
    extra_env:
      KEYFRAME_MODE: "single"
      NUM_STEPS: "25"

  - <<: *hf_img2vid_lrg
    name: thudm/cogvideox-5b-i2v
    description: >
      CogVideoX 5B Image-to-Video from Tsinghua/Zhipu AI. High-quality
      image-conditioned video generation with optional text conditioning.
      Produces 49 frames at 480x720. KEYFRAME_MODE=single.
    extra_env:
      KEYFRAME_MODE: "single"
      NUM_STEPS: "50"

  # ---------------------------------------------------------------------------
  # Video to text
  # ---------------------------------------------------------------------------

  - <<: *hf_vid2txt_sm
    name: llava-hf/llava-onevision-qwen2-7b-ov-hf
    description: >
      LLaVA OneVision 7B from HuggingFace. Vision-language model with strong
      video understanding. Accepts multiple frames as image tokens. Good for
      video captioning, temporal event description, and visual QA over short
      clips. INPUT_MODE=image_frames.
    extra_env:
      INPUT_MODE: "image_frames"
      MAX_FRAMES: "16"

  - <<: *hf_vid2txt_sm
    name: opengvlab/internvl2-8b
    description: >
      InternVL2 8B from Shanghai AI Lab. Strong general vision-language model
      with multi-image support used for video frame understanding. Good
      performance on video QA and temporal reasoning tasks.
      INPUT_MODE=image_frames.
    extra_env:
      INPUT_MODE: "image_frames"
      MAX_FRAMES: "8"
      TRUST_REMOTE_CODE: "true"

  # ---------------------------------------------------------------------------
  # Video to video
  # ---------------------------------------------------------------------------

