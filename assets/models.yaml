#    name: cerspense/zeroscope_v2_576w
#    description: >
#      ZeroScope v2 576w. Compact text-guided video transformation model.
#      Accepts video frames and a text prompt, outputs transformed video.
#      Lower resolution variant (576px wide) with faster inference than XL.
#      Good starting point for vid2vid testing.
#    extra_env:
#      NUM_STEPS: "40"
#      MAX_INPUT_FRAMES: "24"

  # ---------------------------------------------------------------------------
  # Observation to action
  # ---------------------------------------------------------------------------

  - <<: *hf_obs2act_lrg
    name: openvla/openvla-7b
    description: >
      OpenVLA 7B. Open vision-language-action model for robot manipulation
      policy inference. Accepts an RGB observation image and a natural
      language task instruction and returns raw action tokens. Trained on
      the Open X-Embodiment dataset covering diverse robot embodiments and
      tasks. Action decoding and unnormalisation are client responsibilities.
      Requires ACTION_DIM=7 for standard end-effector control.
    extra_env:
      ACTION_DIM: "7"
      TRUST_REMOTE_CODE: "true"
