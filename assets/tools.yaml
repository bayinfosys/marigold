# assets/tools.yaml
# Defines all callable tools available to the Marigold agent.
#
# model_type: must match a ModelType enum value. Used to filter against
#             cache_state.json at index generation time -- the tool is
#             omitted from the generated index if no model of this type
#             is cached.
#
# For non-model tools, omit model_type entirely.

tools:

  # -------------------------------------------------------------------------
  # Model inference tools
  # -------------------------------------------------------------------------

  - name: instruct
    category: model_inference
    description: Run a language model for chat, question answering, summarisation, or translation.
    inputs:
      model_name: "name of the instruct model to use"
      messages: "list of chat turns, each with role (user/assistant) and content"
    outputs:
      reply: "the model's text response"
    model_type: instruct

  - name: text_embed
    category: model_inference
    description: Embed a text string into a dense vector for semantic search or similarity comparison.
    inputs:
      model_name: "name of the embedding model"
      input: "text string to embed"
    outputs:
      vector: "list of floats representing the embedding"
    model_type: text_embed

  - name: image_embed
    category: model_inference
    description: Embed an image into a dense vector for visual search or similarity comparison.
    inputs:
      model_name: "name of the image embedding model"
      image: "base64-encoded image"
    outputs:
      vector: "list of floats representing the embedding"
    model_type: image_embed

  - name: tts
    category: model_inference
    description: Convert text to spoken audio and return an mp3 file.
    inputs:
      model_name: "name of the TTS model"
      text: "text to convert to speech"
      language_code: "BCP-47 language code e.g. eng, fra, deu, spa, cym"
    outputs:
      audio_url: "S3 URL of the generated mp3"
    model_type: tts

  - name: txt2img
    category: model_inference
    description: Generate an image from a text prompt.
    inputs:
      model_name: "name of the image generation model"
      prompt: "text description of the image to generate"
    outputs:
      image_url: "S3 URL of the generated image"
    model_type: txt2img

  - name: img2txt
    category: model_inference
    description: Describe or answer questions about an image.
    inputs:
      model_name: "name of the vision-language model"
      image: "base64-encoded image"
      prompt: "question or instruction about the image"
    outputs:
      reply: "the model's text response"
    model_type: img2txt

  - name: depth
    category: model_inference
    description: Estimate the depth map of an image.
    inputs:
      model_name: "name of the depth estimation model"
      image: "base64-encoded image"
    outputs:
      depth_map_url: "S3 URL of the depth map image"
    model_type: depth

  - name: img2mask
    category: model_inference
    description: Generate a segmentation mask for objects in an image.
    inputs:
      model_name: "name of the segmentation model"
      image: "base64-encoded image"
    outputs:
      mask_url: "S3 URL of the segmentation mask image"
    model_type: img2mask

  - name: text_similarity
    category: model_inference
    description: Compute a similarity score between two text strings.
    inputs:
      model_name: "name of the similarity model"
      text_a: "first text string"
      text_b: "second text string"
    outputs:
      score: "similarity score between 0 and 1"
    model_type: text_similarity

  - name: text_eval
    category: model_inference
    description: Evaluate or score a piece of text against a criterion.
    inputs:
      model_name: "name of the evaluation model"
      text: "text to evaluate"
      criterion: "description of what to evaluate for"
    outputs:
      score: "numeric score"
      explanation: "brief explanation of the score"
    model_type: text_eval

  # -------------------------------------------------------------------------
  # Workflow management tools
  # -------------------------------------------------------------------------

  - name: create_workflow
    category: workflow_management
    description: Save a multi-step inference pipeline as a named reusable template.
    inputs:
      name: "human-readable name for the workflow"
      spec: "YAML string defining the workflow steps and outputs"
    outputs:
      workflow_id: "identifier of the saved template"

  - name: list_workflows
    category: workflow_management
    description: List saved workflow templates belonging to the current user.
    inputs: {}
    outputs:
      workflows: "list of template names and IDs"

  - name: run_workflow
    category: workflow_management
    description: Execute a saved workflow template with specific inputs.
    inputs:
      workflow_id: "ID of the template to run"
      inputs: "key-value map of input values for the workflow"
    outputs:
      execution_id: "identifier of this execution run"

  - name: get_execution
    category: workflow_management
    description: Check the status and retrieve the output of a workflow execution.
    inputs:
      workflow_id: "ID of the workflow template"
      execution_id: "ID of the specific execution run"
    outputs:
      status: "queued, running, complete, or error"
      outcome: "output values when status is complete"

  # -------------------------------------------------------------------------
  # Utility tools
  # -------------------------------------------------------------------------

  - name: http
    category: utility
    description: Make an outbound HTTP request and return the response.
    inputs:
      url: "target URL"
      method: "HTTP method: GET, POST, PUT, DELETE"
      body: "optional request body as a string"
      headers: "optional key-value map of request headers"
    outputs:
      status: "HTTP status code"
      body: "response body as a string"

  - name: search_tools
    category: utility
    description: Search for available tools by describing what you want to do. Returns the most relevant tool definitions.
    inputs:
      query: "natural language description of the task you want to perform"
    outputs:
      tools: "list of matching tool names and descriptions"
