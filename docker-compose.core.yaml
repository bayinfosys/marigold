services:

  cache-init:
    image: marigold/environment:${TAG:-latest}   # CPU image -- see note below, not *-gpu
    command: ["python3", "-m", "tools.model_cli", "download-weights"]
    environment:
      MARIGOLD_MODEL_CATALOGUE_YAMLS: ${MODELS_CATALOGUE:-/app/marigold/models.yaml}
      HF_TOKEN: ${HF_TOKEN:-}
      CACHE_DIR: /models
      HF_HUB_OFFLINE: 0

    volumes:
      - ${MARIGOLD_DIR}:/app/marigold:ro
      - ${MARIGOLD_DIR}/data/models:/models
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marigold}
      POSTGRES_USER: ${POSTGRES_USER:-marigold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marigold}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marigold}"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      cache-init:
        condition: service_completed_successfully


  worker:
    image: marigold/worker:${TAG:-latest}-gpu

    environment:
      MARIGOLD_VERSION: ${TAG:-latest}
      MARIGOLD_DATABASE_URL: postgresql://${POSTGRES_USER:-marigold}:${POSTGRES_PASSWORD:-marigold}@postgres:5432/${POSTGRES_DB:-marigold}
      MARIGOLD_MODEL_CATALOGUE_YAMLS: ${MODELS_CATALOGUE:-/app/assets/models-instruct-3060.yaml}
      SQS_VISIBILITY_TIMEOUT: "300"
      MARIGOLD_QUEUE_IDLE_TIMEOUT: "${IDLE_TIMEOUT:-120}"
      LIFECYCLE_TOPIC: lifecycle
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # huggingface cache -- must match the mount point
      CACHE_DIR: /models
      REMOTE_CODE: "0"
      USE_FAST: "0"
      MARIGOLD_TMP_OFFLOAD: "/tmp/models"
      OUTPUT_BACKEND: "${OUTPUT_BACKEND:-fs}"
      OUTPUT_DIR: /outputs
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue

    volumes:
      - ${MARIGOLD_DIR}/data/models:/models:ro
      - ${MARIGOLD_DIR}/data/tmp:/tmp/models
      - ${MARIGOLD_DIR}/data/outputs:/outputs

    restart: on-failure:3

    depends_on:
      postgres:
        condition: service_healthy
      cache-init:
        condition: service_completed_successfully

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  api:
    image: marigold/worker:${TAG:-latest}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MARIGOLD_VERSION: ${TAG:-latest}
      MARIGOLD_DATABASE_URL: postgresql://${POSTGRES_USER:-marigold}:${POSTGRES_PASSWORD:-marigold}@postgres:5432/${POSTGRES_DB:-marigold}
      LIFECYCLE_TOPIC: lifecycle
      MARIGOLD_RESULTS_TABLE: results
      MARIGOLD_MODEL_CATALOGUE_YAMLS: ${MODELS_CATALOGUE:-/app/marigold/models.yaml}
      MARIGOLD_MODEL_CATALOGUE_TABLE: model_catalogue
    volumes:
      - ${MARIGOLD_DIR}:/app/marigold:ro
    depends_on:
      postgres:
        condition: service_healthy
      cache-init:
        condition: service_completed_successfully
