services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_KEY=${WEBUI_DUMMY_KEY:-marigold}
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - WEBUI_AUTH=false
      - AIOHTTP_CLIENT_TIMEOUT=300
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://api:8000/v1
      - RAG_OPENAI_API_KEY=${WEBUI_DUMMY_KEY:-marigold}
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-minilm-l6-v2
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      - ANONYMIZED_TELEMETRY=False
      - DO_NOT_TRACK=True
      - SCARF_NO_ANALYTICS=True
      - RAG_EMBEDDING_MODEL_AUTO_UPDATE=false
      - RAG_RERANKING_MODEL_AUTO_UPDATE=false
    volumes:
      - ${MARIGOLD_DIR:-./assets}/data/webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      cache-init:
        condition: service_completed_successfully
