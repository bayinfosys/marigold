Comment: "Dummy Step Function for Testing Polling"
StartAt: WaitFor30Seconds
States:
  WaitFor30Seconds:
    Type: Wait
    Seconds: 30
    Next: UpdateStatusToComplete

  UpdateStatusToComplete:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:putItem"  # Register the job
    Parameters:
      TableName: "${results_cache_table}"
      Item:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
        Status:
          S: "complete"  # Set status to "started"
        Response:
          S: "{\"message\": \"finally completed\"}"
    ResultPath: "$.startJobResult"
    Next: SuccessState

  SuccessState:
    Type: Succeed
