Comment: A workflow to manage embedding shard updates with locking
StartAt: MapInputEvents
States:
  MapInputEvents:
    Type: Map
    InputPath: $
    ItemSelector:
      "input.$": $.inputs
    MaxConcurrency: 0

    ItemProcessor:
      StartAt: CheckInputType
      States:
        CheckInputType:
          Type: Choice
          Choices:
            - Variable: "$.embedding"
              IsPresent: true
              Next: IdentifyShard
            - Variable: "$.model"
              IsPresent: true
              Next: GenerateEmbedding
          Default: FailStateDueToInvalidInput

        GenerateEmbedding:
          Type: Task
          Resource: arn:aws:states:::aws-sdk:sfn:startSyncExecution
          Parameters:
            StateMachineArn: ${text_embedding_sfn_arn}
            Input: {
              "model.$": "$.model"
            }
          ResultPath: "$.embedding"
          Next: IdentifyShard

        IdentifyShard:
          Type: Task
          Resource: ${identify_shard_arn}
          Next: AcquireLock
          ResultPath: "$.shard_key"

        AcquireLock:
          Type: Task
          Resource: arn:aws:states:::dynamodb:updateItem
          Parameters:
            TableName: ${lock_table_name}
            Key:
              ShardId:
                S.$: $.shard_key
            UpdateExpression: SET shard_lock = :lockVal
            ExpressionAttributeValues:
              :lockVal:
                BOOL: true
              :falseVal:
                BOOL: false
            ConditionExpression: attribute_not_exists(shard_lock) OR shard_lock = :falseVal
            ReturnValues: ALL_NEW
          ResultPath: null
          Retry:
            - ErrorEquals: ["DynamoDB.ConditionalCheckFailedException"]
              IntervalSeconds: 1
              MaxAttempts: 5
              BackoffRate: 2.0
          Catch:
            - ErrorEquals: ["DynamoDB.ConditionalCheckFailedException"]
              ResultPath: "$.AcquireResult"
              Next: HandleLockAcquisitionFailure
          Next: UpdateShard

        UpdateShard:
          Type: Task
          Resource: ${update_shard_arn}
          Catch:
            - ErrorEquals: ["States.ALL"]
              Next: ReleaseLockOnError
              ResultPath: "$.UpdateResult"
          ResultPath: "$.UpdateResult"
          Next: ReleaseLockOnSuccess

        ReleaseLockOnError:
          Type: Task
          Resource: arn:aws:states:::dynamodb:updateItem
          Parameters:
            TableName: ${lock_table_name}
            Key:
              ShardId:
                S.$: $.shard_key
            UpdateExpression: "SET shard_lock = :falseVal"
            ExpressionAttributeValues:
              ":falseVal":
                BOOL: false
          ResultPath: null
          Next: FailState

        ReleaseLockOnSuccess:
          Type: Task
          Resource: arn:aws:states:::dynamodb:updateItem
          Parameters:
            TableName: ${lock_table_name}
            Key:
              ShardId:
                S.$: $.shard_key
            UpdateExpression: SET shard_lock = :falseVal
            ExpressionAttributeValues:
              :falseVal:
                BOOL: false
          ResultPath: null
          End: true

        HandleLockAcquisitionFailure:
          Type: Fail
          Cause: "Failed to acquire lock"

        FailState:
          Type: Fail
          Cause: "Failed to update shard"

        FailStateDueToInvalidInput:
          Type: Fail
          Cause: "Invalid Input"

    End: true
