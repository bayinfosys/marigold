Comment: "TTS Pipeline"
StartAt: SelectModel
States:
  SelectModel:
    Type: Choice
    Choices:
      - Variable: "$.body.language_code"
        StringEquals: "en-GB"
        Next: MMSTTSEng
      - Variable: "$.body.language_code"
        StringEquals: "cy-GB"
        Next: MMSTTSCym
      - Variable: "$.body.language_code"
        StringEquals: "de-DE"
        Next: MMSTTSDeu
      - Variable: "$.body.language_code"
        StringEquals: "fr-FR"
        Next: MMSTTSFra
      - Variable: "$.body.language_code"
        StringEquals: "es-ES"
        Next: MMSTTSEsp
      - Variable: "$.body.language_code"
        StringEquals: "fn-FN"
        Next: MMSTTSFnn
      - Variable: "$.body.language_code"
        StringEquals: "nl-NL"
        Next: MMSTTSNld
    Default: FailState

  MMSTTSEng:
    Type: Task
    Resource: "${mms-tts-eng}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSCym:
    Type: Task
    Resource: "${mms-tts-cym}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSDeu:
    Type: Task
    Resource: "${mms-tts-deu}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSFra:
    Type: Task
    Resource: "${mms-tts-fra}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSEsp:
    Type: Task
    Resource: "${mms-tts-spa}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSFnn:
    Type: Task
    Resource: "${mms-tts-fin}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
  MMSTTSNld:
    Type: Task
    Resource: "${mms-tts-nld}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete

  UpdateStatusToComplete:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status, #response = :response"
      ExpressionAttributeNames:
        "#status": "sts"
        "#response": "rsp"
      ExpressionAttributeValues:
        ":status":
          S: "complete"
        ":response":
          S.$: "$.results.body"
    ResultPath: "$.dynamoResult"
    Next: SuccessState

  SuccessState:
    Type: Succeed

  FailState:
    Type: Fail
    Error: "Invalid language code specified."
