Comment: "Embedding Pipeline"
StartAt: SelectModel
States:
  SelectModel:
    Type: Choice
    Choices:
      - Variable: "$.body.model"
        StringEquals: "sentence-transformers/all-minilm-l6-v2"
        Next: ModelAllMinilmL6V2
      - Variable: "$.body.model"
        StringEquals: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
        Next: ModelParaphraseMultilingualMPNetBaseV2
      - Variable: "$.body.model"
        StringEquals: "sentence-transformers/sentence-t5-large"
        Next: SentenceT5Large
    Default: InvalidModelState

  ModelAllMinilmL6V2:
    Type: Task
    Resource: "${embedding-all-minilm-l6-v2}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.Timeout
        ResultPath: "$.error.info"
        Next: TimeoutErrorState
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error.info"
        Next: ModelErrorState

  ModelParaphraseMultilingualMPNetBaseV2:
    Type: Task
    Resource: "${embedding-paraphrase-multilingual-mpnet-base-v2}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.Timeout
        ResultPath: "$.error.info"
        Next: TimeoutErrorState
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error.info"
        Next: ModelErrorState

  SentenceT5Large:
    Type: Task
    Resource: "${embedding-sentence-t5-large}"
    ResultPath: "$.results"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.Timeout
        ResultPath: "$.error.info"
        Next: TimeoutErrorState
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error.info"
        Next: ModelErrorState

  UpdateStatusToComplete:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status, #response = :response"
      ExpressionAttributeNames:
        "#status": "sts"
        "#response": "rsp"
      ExpressionAttributeValues:
        ":status":
          S: "complete"
        ":response":
          S.$: "$.results.body"
    ResultPath: "$.dynamoResult"
    Next: SuccessState

  InvalidModelState:
    Type: Fail
    Error: "Invalid model specified."

  ModelErrorState:
    Type: Pass
    ResultPath: "$.error.response"
    Parameters:
      created.$: "$$.Execution.StartTime"  # ISO8601 timestamp NOT epoch
      finish_reason: "error"
      model.$: "$.body.model"
      choices: []
      usage: {}
    Next: UpdateToError

  TimeoutErrorState:
    Type: Pass
    ResultPath: "$.error.response"
    Parameters:
      created.$: "$$.Execution.StartTime"  # ISO8601 timestamp NOT epoch
      finish_reason: "timeout"
      model.$: "$.body.model"
      usage: {}
    Next: UpdateToError

  UpdateToError:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status, #message = :message"
      ExpressionAttributeNames:
        "#status": "sts"
        "#message": "rsp"
      ExpressionAttributeValues:
        ":status":
          S: "error"
        ":message":
          S.$: "States.JsonToString($.error.response)"
    Next: GeneralErrorState

  GeneralErrorState:
    Type: Fail
    Error: "Internal processing error"

  SuccessState:
    Type: Succeed
