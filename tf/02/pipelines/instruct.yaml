Comment: "instruct model execution"
StartAt: SelectModel
States:
  SelectModel:
    Type: Choice
    Choices:
      - Variable: "$.body.model"
        StringEquals: "qwen/qwen2-0.5b-instruct"
        Next: ModelQwen205bInstruct
      - Variable: "$.body.model"
        StringEquals: "qwen/qwen2-1.5b-instruct"
        Next: ModelQwen215bInstruct
      - Variable: "$.body.model"
        StringEquals: "microsoft/phi-3-mini-128k-instruct"
        Next: ModelPhi3Mini128kInstruct
      - Variable: "$.body.model"
        StringEquals: "meta-llama/llama-3.2-1b-instruct"
        Next: ModelLlama321BInstruct
    Default: InvalidModelState

  ModelQwen205bInstruct:
    Type: Task
    Resource: "${qwen2-05b-instruct}"
    ResultPath: "$.modelResult"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.errorInfo"
        Next: ModelErrorState

  ModelQwen215bInstruct:
    Type: Task
    Resource: "${qwen2-15b-instruct}"
    ResultPath: "$.modelResult"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.errorInfo"
        Next: ModelErrorState

  ModelPhi3Mini128kInstruct:
    Type: Task
    Resource: "${microsoft-phi-3-mini-128k-instruct}"
    ResultPath: "$.modelResult"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.errorInfo"
        Next: ModelErrorState

  ModelLlama321BInstruct:
    Type: Task
    Resource: "${meta-llama-32-1b-instruct}"
    ResultPath: "$.modelResult"
    Next: UpdateStatusToComplete
    Catch:
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.errorInfo"
        Next: ModelErrorState

  UpdateStatusToComplete:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status, #response = :response"
      ExpressionAttributeNames:
        "#status": "sts"
        "#response": "rsp"
      ExpressionAttributeValues:
        ":status":
          S: "complete"
        ":response":
          S.$: "$.modelResult.body"
    ResultPath: "$.dynamoResult"
    Next: SuccessState

  InvalidModelState:
    Type: Fail
    Error: "Invalid model specified."

  ModelErrorState:
    Type: Pass
    Next: UpdateToError

  UpdateToError:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status"
      ExpressionAttributeNames:
        "#status": "sts"
      ExpressionAttributeValues:
        ":status":
          S: "error"
    ResultPath: "$.updateToErrorResult"
    Next: GeneralErrorState

  GeneralErrorState:
    Type: Fail
    Error: "Internal processing error"

  SuccessState:
    Type: Succeed
