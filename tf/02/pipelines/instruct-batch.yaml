Comment: "Instruct(chat) Pipeline"
StartAt: CheckIfExists
States:
  CheckIfExists:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:getItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
    ResultPath: "$.dynamoResult"
    Next: DecideNextStep

  DecideNextStep:
    Type: Choice
    Choices:
      - Variable: "$.dynamoResult.Item"
        IsPresent: true
        Next: CheckStatus
    Default: RunModel

  CheckStatus:
    Type: Choice
    Choices:
      - Variable: "$.dynamoResult.Item.Status.S"
        StringEquals: "complete"
        Next: ReturnExistingItem
      - Variable: "$.dynamoResult.Item.Status.S"
        StringEquals: "pending"
        Next: ReturnPendingStatus
      - Variable: "$.dynamoResult.Item.Status.S"
        StringEquals: "started"
        Next: UpdateToPending

  UpdateToPending:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status"
      ExpressionAttributeNames:
        "#status": "Status"
      ExpressionAttributeValues:
        ":status":
          S: "pending"
    ResultPath: "$.updateToPendingResult"
    Next: RunModel

  UpdateToError:
    Type: Task
    Resource: "arn:aws:states:::dynamodb:updateItem"
    Parameters:
      TableName: "${results_cache_table}"
      Key:
        PK:
          S.$: "$.destination.userid"
        SK:
          S.$: "$.destination.message_id"
      UpdateExpression: "SET #status = :status"
      ExpressionAttributeNames:
        "#status": "Status"
      ExpressionAttributeValues:
        ":status":
          S: "error"
    ResultPath: "$.updateToErrorResult"
    Next: GeneralErrorState

  ReturnExistingItem:
    Type: Pass
    Parameters:
      "message_id.$": "$.destination.message_id"
      "response.$": "States.StringToJson($.dynamoResult.Item.Response.S)"
    Next: SuccessState

  ReturnPendingStatus:
    Type: Pass
    Parameters:
      "status": "pending"
    Next: SuccessState

  RunModel:
    Type: Task
    Resource: arn:aws:states:::batch:submitJob.sync
    TimeoutSeconds: 1800
    Parameters:
      JobName: execute-instruct
      JobQueue: ${instruct_batch_job_queue_arn}
      JobDefinition: ${instruct_batch_job_definition_arn}
      ContainerOverrides:
        Command:
          - python
          - lambda_function.py
          - '{$.destination.userid, $.destination.message_id, States.JSONToString($.input)}'
        Environment:
          - Name: RESULTS_TABLE
            Value: ${results_cache_table}
        Vcpus: 2
        Memory: 4096
    Next: SuccessState
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: ModelErrorState

  SuccessState:
    Type: Succeed

#  InvalidModelState:
#    Type: Fail
#    Error: "Invalid model specified."

  ModelErrorState:
    Type: Pass
    Next: UpdateToError

  GeneralErrorState:
    Type: Fail
    Error: "Internal processing error"
