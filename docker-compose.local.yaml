services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marigold}
      POSTGRES_USER: ${POSTGRES_USER:-marigold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marigold}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marigold}"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: marigold/worker:${TAG:-latest}-gpu
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marigold}:${POSTGRES_PASSWORD:-marigold}@postgres:5432/${POSTGRES_DB:-marigold}
      MODELS_CONFIG_PATH: /app/assets/models.json
      MARIGOLD_MODELS: ${MARIGOLD_MODELS:-0dca151a8ff01ced4a093e781d7ee2b9}
      SQS_VISIBILITY_TIMEOUT: "300"
      MARIGOLD_QUEUE_IDLE_TIMEOUT: "${IDLE_TIMEOUT:-120}"
      LIFECYCLE_TOPIC: lifecycle
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # huggingface cache -- must match the mount point
      CACHE_DIR: /models
      HF_HUB_CACHE: /models
      HF_HOME: /tmp
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      REMOTE_CODE: "0"
      USE_FAST: "0"
      MARIGOLD_TMP_OFFLOAD: "/tmp/models"
      OUTPUT_BACKEND: "${OUTPUT_BACKEND:-fs}"
      OUTPUT_DIR: /outputs
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

    volumes:
      - ${MARIGOLD_CACHE_DIR:-./cache/models}:/models:ro
      - ${MARIGOLD_MODELS_CONFIG:-./assets/models-3060.json}:/app/assets/models.json:ro
      - ${MARIGOLD_MODEL_TMP_DIR:-./cache/tmp}:/tmp/models
      - ${MARIGOLD_OUTPUT_DIR:-./cache/outputs}:/outputs

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    image: marigold/worker:${TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marigold}:${POSTGRES_PASSWORD:-marigold}@postgres:5432/${POSTGRES_DB:-marigold}
      MODELS_CONFIG_PATH: /app/assets/models.json
      LIFECYCLE_TOPIC: lifecycle
      RESULTS_TABLE: results
    volumes:
      - ${MARIGOLD_MODELS_CONFIG:-./assets/models-3060.json}:/app/assets/models.json:ro


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_KEY=${WEBUI_DUMMY_KEY:-marigold}
      - OPENAI_API_BASE_URL=http://api:8000/v1
      - WEBUI_AUTH=false
      - AIOHTTP_CLIENT_TIMEOUT=300
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - api

volumes:
  open-webui:
