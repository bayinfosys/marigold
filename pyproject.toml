[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bayis-marigold"
dynamic = ["version"]
description = "Open source inference API for open-weight models. Self-hosted on your own hardware, or run for you as a managed service."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["inference", "llm", "open-weight", "self-hosted", "on-premise", "sovereign-ai", "openai-compatible", "air-gapped"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "packaging>=24",
  "pydantic>=2",
  "PyYAML",
  "httpx",
  "dynawrap",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
api = [
  "bayis-marigold[postgres]",
  "fastapi",
  "uvicorn",
]
inference = [
  "torch",
  "torchvision",
  "transformers",
  "sentence-transformers",
  "diffusers",
  "accelerate",
  "sentencepiece",
  "protobuf",
  "einops",
  "pydub",
  "nvidia-ml-py",
]
gpu = ["bitsandbytes"]
worker = ["bayis-marigold[inference,postgres]"]
cache = [
  "bayis-marigold[inference,postgres]",
  "huggingface_hub",
]

[project.urls]
Homepage = "https://marigold.run"
Repository = "https://github.com/bayinfosys/marigold"
Examples = "https://github.com/bayinfosys/marigold-examples"
Issues = "https://github.com/bayinfosys/marigold/issues"
"Managed hosting" = "https://www.bayis.co.uk/sovereign-ai.html"
"Bay Information Systems" = "https://www.bayis.co.uk/"

[project.scripts]
marigold = "cli.main:main"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"" = "package/src"}
packages = ["api", "backend", "models", "shared", "tools", "cli", "compose"]

[tool.setuptools.package-data]
compose = ["*.yaml", "Dockerfile", "environment/*.txt"]
cli = ["site/*", "site/_layouts/*", "site/_includes/*", "site/_includes/icons/*", "site/assets/*"]
