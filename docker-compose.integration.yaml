# docker-compose.integration.yml
#
# Local integration test environment.
# Runs LocalStack (S3 + DynamoDB) alongside the model container.
# All boto3 clients in the application are redirected to LocalStack
# via AWS_ENDPOINT_URL -- no application code changes required.
#
# Usage:
#   docker compose -f docker-compose.integration.yml up --abort-on-container-exit
#   docker compose -f docker-compose.integration.yml down -v

services:

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sqs
      - AWS_DEFAULT_REGION=eu-west-2
      - LOCALSTACK_HOST=localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - localstack-data:/var/lib/localstack

  setup:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-2
      - AWS_ENDPOINT_URL=http://localstack:4566
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "creating s3 bucket..."
        aws s3api create-bucket \
          --bucket test-outputs \
          --region eu-west-2 \
          --create-bucket-configuration LocationConstraint=eu-west-2

        echo "creating results table..."
        aws dynamodb create-table \
          --table-name test-results \
          --attribute-definitions \
            AttributeName=PK,AttributeType=S \
            AttributeName=SK,AttributeType=S \
          --key-schema \
            AttributeName=PK,KeyType=HASH \
            AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST

        echo "creating usage table..."
        aws dynamodb create-table \
          --table-name test-usage \
          --attribute-definitions \
            AttributeName=PK,AttributeType=S \
            AttributeName=SK,AttributeType=S \
          --key-schema \
            AttributeName=PK,KeyType=HASH \
            AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST

        echo "creating metrics queue..."
        aws sqs create-queue --queue-name test-metrics

        echo "setup complete"

  marigold:
    image: vecmdl/environment:${TAG}
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      # AWS credentials -- dummy values accepted by LocalStack
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-2
      # Routes all boto3 clients to LocalStack
      - AWS_ENDPOINT_URL=http://localstack:4566
      # Application env vars
      - DYNAMODB_TABLE=test-results
      - DYNAMODB_USAGE_TABLE=test-usage
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - OUTPUT_BUCKET=test-outputs
      - METRICS_QUEUE_URL=http://localstack:4566/000000000000/test-metrics
      - MODELS_YAML_PATH=/app/assets/models.yaml
      - CACHE_DIR=/models
      - HF_HUB_CACHE=/models
      - HF_HUB_OFFLINE=1
      - LOG_LEVEL=INFO
    volumes:
      - ./assets/models.yaml:/app/assets/models.yaml:ro
      - ./test-workflows:/workflows:ro
      - ./cache/models:/models:ro
      - ./cache/outputs:/outputs
    command: sleep infinity

volumes:
  localstack-data:
