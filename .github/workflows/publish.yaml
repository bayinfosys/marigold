# .github/workflows/release.yaml
name: release

on:
  push:
    tags: ["v*"]
    branches: [master]

jobs:
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, cache, worker, worker-gpu, executor]
        include:
          - target: worker-gpu
            tag_suffix: "-gpu"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install setuptools_scm
        run: pip install setuptools_scm

      - name: derive version
        id: version
        run: echo "tag=$(make -s print/tag)" >> "$GITHUB_OUTPUT"

      - name: build
        run: make build/${{ matrix.target }} TAG=${{ github.sha }}

      - name: push master
        if: github.ref == 'refs/heads/master'
        run: |
          IMAGE=$(make -s print/${{ matrix.target }}-image)
          docker tag $IMAGE:${{ github.sha }}${{ matrix.tag_suffix }} $IMAGE:master${{ matrix.tag_suffix }}
          docker push $IMAGE:master${{ matrix.tag_suffix }}

      - name: push latest + version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=$(make -s print/${{ matrix.target }}-image)
          VERSION=${{ steps.version.outputs.tag }}
          docker tag $IMAGE:${{ github.sha }}${{ matrix.tag_suffix }} $IMAGE:$VERSION${{ matrix.tag_suffix }}
          docker tag $IMAGE:${{ github.sha }}${{ matrix.tag_suffix }} $IMAGE:latest${{ matrix.tag_suffix }}
          docker push $IMAGE:$VERSION${{ matrix.tag_suffix }}
          docker push $IMAGE:latest${{ matrix.tag_suffix }}

  package:
    needs: containers
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      # Relative links in the README point at docs/ in this repository.
      # On PyPI they resolve against pypi.org and break, so the wheel's
      # copy links to the same files on GitHub at this ref. The
      # repository's own README keeps its relative links.
      - name: Rewrite README links for PyPI
        run: |
          perl -pi -e 's#\]\((?!https?://|\#|mailto:)([^)\s]+)\)#](https://github.com/bayinfosys/marigold/blob/$ENV{GITHUB_REF_NAME}/$1)#g' README.md
          grep -n "](docs/" README.md && exit 1 || true

      - name: Build
        run: python -m build

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
